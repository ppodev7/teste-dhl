version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: zyx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zyx
    volumes:
      - mongodb_data:/data/db
    networks:
      - zyx-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/zyx --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zyx-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/zyx
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zyx-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zyx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - zyx-network

volumes:
  mongodb_data:
    driver: local

networks:
  zyx-network:
    driver: bridge

